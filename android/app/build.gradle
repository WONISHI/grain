apply plugin: 'com.android.application'

def grainLocal = new Properties()
def grainLocalFile = rootProject.file('local.properties')
if (grainLocalFile.exists()) grainLocalFile.withInputStream { grainLocal.load(it) }
def grainSdk = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME') ?: grainLocal.getProperty('sdk.dir')
def grainNdk = System.getenv('ANDROID_NDK_HOME') ?: (grainSdk ? "${grainSdk}/ndk/27.0.12077973" : null)
def grainHostTag = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? 'darwin-x86_64' : 'linux-x86_64'
def grainPtyClang = grainNdk ? "${grainNdk}/toolchains/llvm/prebuilt/${grainHostTag}/bin/aarch64-linux-android24-clang" : null

// APK 版本跟随仓库根目录 package.json，避免改 npm 版本后系统里仍显示 1.0。
def grainPackageFile = rootProject.file('../package.json')
def grainPackage = new groovy.json.JsonSlurper().parse(grainPackageFile)
def grainVersionName = (grainPackage.version ?: '0.0.0').toString()
def grainVersionParts = grainVersionName.tokenize('.').collect { part ->
    def digits = (part =~ /^(\d+)/)
    digits.find() ? digits.group(1) as int : 0
}
while (grainVersionParts.size() < 3) grainVersionParts << 0
def grainVersionCode = grainVersionParts[0] * 10000 + grainVersionParts[1] * 100 + grainVersionParts[2]
if (grainVersionCode < 1) grainVersionCode = 1
println "Grain Android versionName=${grainVersionName} versionCode=${grainVersionCode}"

tasks.register('buildGrainPty', Exec) {
    def output = file('src/main/jniLibs/arm64-v8a/libgrain_pty.so')
    inputs.file('src/main/cpp/grain_pty.c')
    outputs.file(output)
    onlyIf {
        def clang = grainPtyClang ? file(grainPtyClang) : null
        clang != null && clang.isFile()
    }
    doFirst {
        output.parentFile.mkdirs()
        if (grainPtyClang == null || !file(grainPtyClang).isFile()) {
            throw new GradleException("找不到 NDK clang：${grainPtyClang}")
        }
    }
    commandLine grainPtyClang, '-shared', '-fPIC', '-O2', '-pthread',
        '-Wl,-z,max-page-size=16384',
        '-Wl,-soname,libgrain_pty.so',
        '-o', output.absolutePath,
        file('src/main/cpp/grain_pty.c').absolutePath
}
tasks.named('preBuild').configure {
    dependsOn('buildGrainPty')
    doFirst {
        def pty = file('src/main/jniLibs/arm64-v8a/libgrain_pty.so')
        if (!pty.isFile()) {
            throw new GradleException('缺少 libgrain_pty.so：请先编译 PTY，或解压 CI 用的 native-libs 包')
        }
    }
}

android {
    namespace = "app.grain.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.grain.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode grainVersionCode
        versionName grainVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.documentfile:documentfile:1.0.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
